<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AskPupkin</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">AskPupkin</a>
                </div>
                <div class="search">
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-menu">
                    <div class="user-unauth">
                        <a href="login.html" class="btn btn-secondary">Log in</a>
                        <a href="signup.html" class="btn btn-primary">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <div class="auth-wrapper">
            <div class="auth-form">
                <div class="page-header">
                    <h1>Register</h1>
                </div>
                <form>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email...">
                    </div>

                    <div class="form-group">
                        <label>Nickname</label>
                        <input type="text" placeholder="Choose your nickname...">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create a password...">
                        <div class="form-help">Password must be at least 8 characters long</div>
                    </div>

                    <div class="form-group">
                        <label>Repeat Password</label>
                        <input type="password" placeholder="Repeat your password...">
                    </div>

                    <div class="form-group">
                        <label>Upload Avatar</label>
                        <input type="file">
                        <div class="form-help">Optional: upload your profile picture</div>
                    </div>

                    <div class="form-errors">
                        <div class="error-message">
                            Email is already registered
                        </div>
                        <div class="error-message">
                            Nickname is too short (minimum 3 characters)
                        </div>
                        <div class="error-message">
                            Passwords do not match
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Register</button>
                    
                    <div class="auth-links">
                        <a href="login.html">already have an account?</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
