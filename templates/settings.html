<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AskPupkin</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/settings.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">AskPupkin</a>
                </div>
                <div class="search">
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-menu">
                    <a href="ask.html" class="btn btn-primary">Ask Question</a>
                    <div class="user-auth">
                        <div class="avatar-small"></div>
                        <span >Dr. Pepper</span>
                        <div class="dropdown">
                            <a href="settings.html">Settings</a>
                            <a href="login.html">Log out</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <div class="content-wrapper">
            <div class="content">
                <div class="page-header">
                    <h1>Settings</h1>
                </div>
                <form class="settings-form">
                    <div class="avatar-upload">
                        <div class="avatar-large"></div>
                        <div class="upload-controls">
                            <input type="file">
                            <button type="button" class="btn btn-secondary">Upload New Avatar</button>
                            <button type="button" class="btn btn-outline">Remove Avatar</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="dr.pepper@example.com">
                    </div>

                    <div class="form-group">
                        <label>Nickname</label>
                        <input type="text" value="Dr. Pepper">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" placeholder="Enter new password...">
                        <div class="form-help">Leave blank to keep current password</div>
                    </div>

                    <div class="form-group">
                        <label>Repeat New Password</label>
                        <input type="password" placeholder="Repeat new password...">
                    </div>

                    <div class="form-errors">
                        <div class="error-message">
                            Email is already in use
                        </div>
                        <div class="error-message">
                            Passwords do not match
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>

            <aside class="sidebar">
                <div class="sidebar-block">
                    <h3>Popular Tags</h3>
                    <div class="tags">
                        <a href="tag.html" class="tag">perl</a>
                        <a href="tag.html" class="tag tag-popular">python</a>
                        <a href="tag.html" class="tag">TechnoPark</a>
                        <a href="tag.html" class="tag tag-popular">MySQL</a>
                        <a href="tag.html" class="tag">django</a>
                    </div>
                </div>
                <div class="sidebar-block">
                    <h3>Best Members</h3>
                    <ul class="members-list">
                        <li><a href="#">Mr. Freeman</a></li>
                        <li><a href="#">Dr. House</a></li>
                        <li><a href="#">Bender</a></li>
                        <li><a href="#">Queen Victoria</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
