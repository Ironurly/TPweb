<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AskPupkin</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">AskPupkin</a>
                </div>
                <div class="search">
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-menu">
                    <div class="user-unauth">
                        <a href="login.html" class="btn btn-secondary">Log in</a>
                        <a href="signup.html" class="btn btn-primary">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <div class="auth-wrapper">
            <div class="auth-form">
                <div class="page-header">
                    <h1>Log In</h1>
                </div>
                <form method="POST">
                    <div class="form-group">
                        <label for="login">Login</label>
                        <input type="text" id="login" placeholder="Enter your login..." required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password..." required>
                    </div>

                    <div class="form-errors">
                        <div class="error-message">
                            Invalid login or password
                        </div>
                        <div class="error-message">
                            This account has been suspended
                        </div>
                    </div>
                </form>
                <button type="submit" class="btn btn-full">Log In</button>
                <div class="auth-links">
                    <a href="signup.html">create new account</a>
                </div>
            </div>
        </div>
    </main>
        <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="ask.html">Ask Question</a></li>
                        <li><a href="#">Popular Tags</a></li>
                        <li><a href="#">Best Members</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Help</h4>
                    <ul>
                        <li><a href="#">About Us</a></li>
                        <li><a href="#">Contact</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                        <li><a href="#">Terms of Service</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 AskPupkin </p>
            </div>
        </div>
    </footer>
</body>
</html>
