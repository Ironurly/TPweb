<div class="question">
    <div class="question-left">
        <div class="avatar-medium">
            {% if question.author.profile.avatar %}
                <img src="{{ question.author.profile.avatar.url }}">
            {% endif %}
        </div>
        <div class="voting">
            <button class="like-btn question-vote-btn {% if question.user_vote == 'like' %}active{% endif %}" data-question-id="{{ question.id }}" data-vote-type="like">↑</button>
            <span class="likes-count">{{ question.likes }}</span>
            <button class="like-btn question-vote-btn {% if question.user_vote == 'dislike' %}active{% endif %}" data-question-id="{{ question.id }}" data-vote-type="dislike">↓</button>
        </div>
    </div>
    <div class="question-right">
        <h3 class="question-title">
            <a href="{% url 'webproject:question_detail' question.id %}">{{ question.title }}</a>
        </h3>
        <p class="question-text">{{ question.body }}</p>
        <div class="question-meta">
            <a href="{% url 'webproject:question_detail' question.id %}" class="answers-count">answers ({{ question.answers_count }})</a>
            <div class="tags">
                Tags:
                {% for tag in question.tags.all %}
                    <a href="{% url 'webproject:tag' tag_name=tag.title %}" class="tag">{{ tag.title }}</a>
                {% empty %}
                    <span class="no-tags">No tags</span>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
