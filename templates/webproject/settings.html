{% extends "base.html" %}
{% block title %}
    <title>Settings</title>
{% endblock title %}
{% block content %}
<div class="content">
    <div class="page-header">
        <h1>Settings</h1>
    </div>
    
    {% if form.errors %}
        <div class="alert alert-error">
            {% for field, errors in form.errors.items %}
                {% for error in errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}
    
    <div class="settings-form">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="avatar-upload">
                <div class="avatar-large"></div>
                <div class="upload-controls">
                    <input type="file" name="avatar">
                    <button type="button" class="btn btn-secondary">Upload New Avatar</button>
                    <button type="button" class="btn btn-outline">Remove Avatar</button>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ form_data.email }}" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
            </div>

            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" value="{{ form_data.nickname }}" required minlength="3">
            </div>

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password..." minlength="8">
            </div>

            <div class="form-group">
                <label for="password_r">Repeat New Password</label>
                <input type="password" id="password_r" name="password_r" placeholder="Repeat new password...">
            </div>
            <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
        
    </div>
</div>
{% endblock %}
