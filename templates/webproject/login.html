{% extends "base.html" %}
{% block title %}
    <title>Login</title>
{% endblock title %}
{% block content %}
<div class="content">
    <div class="auth-wrapper">
        <div class="auth-form">
            <div class="page-header">
                <h1>Log In</h1>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="login" name="email" value="{{ form_data.email }}" placeholder="Enter your email..." required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password..." required>
                </div>
                <button type="submit" class="btn btn-full">Log In</button>
            </form>
            <div class="auth-links">
                <a href="{% url 'users:signup' %}">create new account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
