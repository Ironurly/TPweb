{% extends "base.html" %}
{% block title %}
    <title>Ask</title>
{% endblock title %}
{% block content %}
<div class="content">
    <div class="page-header">
        <h1>Ask Question</h1>
    </div>
    <div class="ask-form">
        <form method="POST">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter your question title..." required>
                <div class="form-help">Make your title clear and descriptive</div>
            </div>

            <div class="form-group">
                <label for="text">Text</label>
                <textarea placeholder="Enter your question details..." id="text" rows="15"></textarea>
                <div class="form-help">Provide all the information someone would need to answer your question</div>
            </div>

            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" placeholder="Enter tags separated by commas...">
                <div class="form-help">Add up to 5 tags to describe what your question is about</div>
            </div>
            <button type="submit" class="btn btn-primary">Ask Question</button>
        </form>
    </div>
</div>
{% endblock %}
