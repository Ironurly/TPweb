{% extends "base.html" %}
{% block title %}
    <title>Sign Up</title>
{% endblock title %}
{% block content %}
<div class="content">
    <div class="auth-wrapper">
        <div class="auth-form">
            <div class="page-header">
                <h1>Register</h1>
            </div>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ form_data.email }}" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                </div>

                <div class="form-group">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" value="{{ form_data.nickname }}" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter new password..." required minlength="8">
                </div>

                <div class="form-group">
                    <label for="password_r">Repeat Password</label>
                    <input type="password" id="password_r" name="password_r" placeholder="Repeat new password..." required>
                </div>

                <div class="form-group">
                    <label for="avatar">Upload Avatar</label>
                    <input type="file" id="avatar" name="avatar">
                    <div class="form-help">Optional: upload your profile picture</div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Register</button>
            </form>
            
            <div class="auth-links">
                <a href="{% url 'webproject:login' %}">already have an account?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
