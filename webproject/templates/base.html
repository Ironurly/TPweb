{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskPupkin</title>
    <link rel="stylesheet" href="{% static 'webproject/css/base.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">AskPupkin</a>
                </div>
                <div class="search">
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-menu">
                    <a href="ask.html" class="btn btn-primary">Ask Question</a>
                    <div class="user-auth">
                        <div class="avatar-small"></div>
                        <span>Dr. Pepper</span>
                        <div class="dropdown">
                            <a href="settings.html">Settings</a>
                            <a href="login.html">Log out</a>
                        </div>
                    </div>
                    <div>
                        <a href="login.html" class="btn btn-secondary">Log in</a>
                        <a href="signup.html" class="btn btn-primary">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <div class="content-wrapper">
            <div class="content">
            </div>
            <aside class="sidebar">
                <div class="sidebar-block">
                    <h3>Popular Tags</h3>
                    <div class="tags">
                        <a href="tag.html" class="tag">perl</a>
                        <a href="tag.html" class="tag tag-popular">python</a>
                        <a href="tag.html" class="tag">TechnoPark</a>
                        <a href="tag.html" class="tag tag-popular">MySQL</a>
                        <a href="tag.html" class="tag">django</a>
                    </div>
                </div>
                <div class="sidebar-block">
                    <h3>Best Members</h3>
                    <ul class="members-list">
                        <li><a href="#">Mr. Freeman</a></li>
                        <li><a href="#">Dr. House</a></li>
                        <li><a href="#">Bender</a></li>
                        <li><a href="#">Queen Victoria</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
