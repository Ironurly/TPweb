{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AskPupkin</title>
    <link rel="stylesheet" href="{% static 'webproject/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'webproject/css/auth.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">AskPupkin</a>
                </div>
                <div class="search">
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-menu">
                    <div class="user-unauth">
                        <a href="login.html" class="btn btn-secondary">Log in</a>
                        <a href="signup.html" class="btn btn-primary">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <div class="auth-wrapper">
            <div class="auth-form">
                <div class="page-header">
                    <h1>Log In</h1>
                </div>
                <form>
                    <div class="form-group">
                        <label for="login">Login</label>
                        <input type="text" placeholder="Enter your login...">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" placeholder="Enter your password...">
                    </div>

                    <div class="form-errors">
                        <div class="error-message">
                            Invalid login or password
                        </div>
                        <div class="error-message">
                            This account has been suspended
                        </div>
                    </div>

                    <button type="submit" class="btn btn-full">Log In</button>
                    
                    <div class="auth-links">
                        <a href="signup.html">create new account</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
